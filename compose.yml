x-app-environment: &app-environment
  RAILS_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
  DATABASE_URL: postgres://umanni:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/umanni_production
  QUEUE_DATABASE_URL: postgres://umanni:${POSTGRES_PASSWORD}@db:5432/umanni_production_queue
  CABLE_DATABASE_URL: postgres://umanni:${POSTGRES_PASSWORD}@db:5432/umanni_production_cable
  APP_HOST: localhost:8080
  APP_PROTOCOL: http

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: umanni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: umanni_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umanni -d umanni_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: umanni:local
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    image: umanni:local
    command: ["./bin/jobs"]
    environment: *app-environment
    volumes:
      - app_storage:/rails/storage
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
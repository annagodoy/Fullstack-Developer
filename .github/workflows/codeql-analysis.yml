name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: "0 7 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Ruby and JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ruby,javascript-typescript
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v4